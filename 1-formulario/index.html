<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body id="body">
    <form id="form">
        <h1 id="titulo">Formulario de Contacto</h1>

        <hr>
        <label id="label">
          Nombre:
          <input id="nombre" type="text" name="name">
        </label>

        <hr>
        
        <label id="label2">
          Apellidos:
          <input id="apellidos" type="text" name="surname">
        </label>
        
        <hr>
        
        <label id="label3">
          Sexo:
          <input id="hombre" type="radio" name="sex" value="male"> Masculino
          <input id="mujer" type="radio" name="sex" value="female"> Femenino
        </label>
        <hr>
        
        <label id="label4">
          Nick:
          <input id="nickname" type="text" name="nickname">
        </label>
        
        <hr>
        
        <label id="label5">
          Email:
          <input id="email" type="email" name="email">
        </label>
        
        <hr>
        
        <label id="label6">
          Comentario:
          <textarea id="comentario" name="message"></textarea>
        </label>
        
        <hr>

        <button id="enviar" type="submit">Enviar</button>
        <button id="reject" type="reset">Reject</button>

      <div id="datos"></div>

    </form>

      <script src="script/miscript.js"></script>
      
  </body>
</html>
